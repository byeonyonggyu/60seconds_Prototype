<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>임계점의 거실</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap');

    :root { --ink:#17211e; --paper:#e8e7df; --muted:#7b837e; --line:#c4c7bc; --acid:#d5f264; --rust:#d76545; --sky:#a8d9dd; --night:#202d2a; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#c7d1c8; font-family:'IBM Plex Sans KR', sans-serif; min-height:100vh; }
    button { font:inherit; cursor:pointer; }

    .rail { padding:28px 24px; background:var(--night); color:#edf0e3; display:flex; flex-direction:column; justify-content:space-between; }
    .eyebrow { font:500 11px 'DM Mono', monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--acid); }
    h1,h2,h3,p { margin:0; } h1 { margin-top:12px; font-size:clamp(27px,3vw,46px); line-height:1.05; letter-spacing:-.06em; }
    .rail-copy { margin-top:19px; color:#abb8ae; font-size:13px; line-height:1.75; }
    .day-wrap { margin-top:44px; padding-top:16px; border-top:1px solid #46534d; }
    .day { font:500 72px/.9 'DM Mono', monospace; color:var(--acid); letter-spacing:-.1em; }
    .day-label { margin-top:9px; color:#aebcb2; font-size:12px; }
    .meter { margin-top:26px; } .meter-line { display:flex; justify-content:space-between; margin-bottom:8px; font:500 11px 'DM Mono', monospace; color:#b5c1b5; }
    .meter-bar { height:7px; background:#43504a; } .meter-fill { height:100%; transition:width .5s ease; }
    .fill-blue { background:var(--sky); } .fill-red { background:var(--rust); } .fill-green { background:var(--acid); }
    .quote { color:#87968b; font-size:12px; line-height:1.6; border-left:2px solid #59685f; padding-left:14px; }
    main { min-width:0; padding:28px clamp(22px,4vw,64px) 42px; background:linear-gradient(150deg,#ecece5 0%,#dedfd5 100%); }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:32px; }
    .status { display:flex; align-items:center; gap:9px; font:500 11px 'DM Mono',monospace; text-transform:uppercase; letter-spacing:.08em; }
    .status-dot { width:8px; height:8px; border-radius:50%; background:var(--rust); box-shadow:0 0 0 4px #d7654526; }
    .restart { border:1px solid var(--line); background:transparent; color:var(--ink); padding:9px 12px; font-size:11px; }
    .news { border-top:1px solid var(--ink); padding-top:14px; display:grid; grid-template-columns:90px 1fr; gap:18px; }
    .news-tag { font:500 11px 'DM Mono',monospace; color:var(--rust); } .news h2 { font-size:clamp(20px,2.5vw,32px); line-height:1.15; letter-spacing:-.05em; } .news p { margin-top:10px; color:#57615b; font-size:13px; line-height:1.7; }
    .living-room { margin-top:34px; min-height:300px; position:relative; overflow:hidden; background:var(--sky); border:1px solid #8caeae; transition:background .8s ease; }
    .living-room::before { content:''; position:absolute; inset:0; opacity:.23; background:repeating-linear-gradient(90deg,transparent 0 31px,#fff 32px 33px); }
    .window { position:absolute; right:10%; top:22px; width:37%; height:58%; border:11px solid #738b86; background:linear-gradient(#badfe0,#d7e7da); transition:all .8s ease; }
    .window::after { content:'2038 / NEW SONGDO'; position:absolute; right:9px; top:10px; font:10px 'DM Mono'; color:#546d6b; }
    .sofa { position:absolute; left:12%; bottom:23px; width:47%; height:75px; background:#8c765f; border-radius:18px 18px 5px 5px; box-shadow:0 18px 0 -9px #705c4b; }
    .plant { position:absolute; left:67%; bottom:21px; font-size:49px; filter:saturate(.7); }
    .radio { position:absolute; left:8%; bottom:99px; font-size:29px; }
    .room-label { position:absolute; bottom:13px; right:15px; font:10px 'DM Mono'; color:#5d706c; }
    .family { position:absolute; z-index:2; bottom:27px; width:92px; display:flex; flex-direction:column; align-items:center; gap:4px; color:#283d38; font-size:10px; font-weight:600; text-align:center; }
    .family-avatar { width:82px; height:108px; display:block; object-fit:cover; border:2px solid #415f59; border-radius:5px; background:#e7d4bd; box-shadow:0 4px 0 #6d7e76; }
    .family-meter { width:48px; height:4px; background:#d6e1d8; } .family-meter i { display:block; height:100%; background:var(--acid); }
    .family-dad { left:12%; } .family-mom { left:32%; bottom:34px; } .family-son { left:52%; bottom:29px; } .family-daughter { left:72%; bottom:34px; }
    .family-mom .family-avatar { background:#c9e0cf; } .family-son .family-avatar { background:#d7c8e0; } .family-daughter .family-avatar { background:#d4e1a7; } .family.morality-low .family-avatar { filter:grayscale(.45) sepia(.35) contrast(1.25); box-shadow:0 4px 0 #8c4037, 0 0 14px #d7654566; } .family.selfish-high .family-avatar { filter:saturate(1.45) contrast(1.3); border-color:var(--rust); } .family.morality-low::after { content:'도덕심 붕괴'; color:var(--rust); font:9px 'DM Mono'; } .family.selfish-high::after { content:'이기심 상승'; color:var(--rust); font:9px 'DM Mono'; } .family.morality-low.selfish-high .family-avatar { filter:grayscale(.2) sepia(.5) saturate(1.8) contrast(1.45); transform:skew(-2deg) rotate(-1deg); }
    .simulation-signal { position:absolute; z-index:4; left:18px; right:18px; top:18px; display:flex; align-items:center; gap:10px; padding:10px 13px; border:1px solid var(--acid); background:#17211ee8; color:#edf0e3; font:11px 'DM Mono'; opacity:0; transform:translateY(-10px); transition:opacity .3s, transform .3s; } .simulation-signal.visible { opacity:1; transform:translateY(0); } .simulation-signal strong { color:var(--acid); font-size:10px; } .signal-pulse { width:7px; height:7px; border-radius:50%; background:var(--rust); box-shadow:0 0 0 5px #d7654538; } .simulation-signal.good { border-color:var(--acid); } .simulation-signal.hard { border-color:var(--rust); } .choice.selected { background:var(--acid); border-color:var(--ink); transform:translateX(5px); }
    .bunker-arch { position:absolute; inset:0; border:2px solid #87908a; border-radius:48% 48% 0 0; background:repeating-linear-gradient(90deg,transparent 0 38px,#7c8780 39px 40px),linear-gradient(#b5b7ae,#727b74); opacity:.55; } .shelf { position:absolute; z-index:1; right:8%; top:16%; width:34%; height:43%; padding:15px 9px; border:9px solid #674f3b; background:#4b3e30; box-shadow:0 6px 0 #362e27; } .shelf::before,.shelf::after { content:''; position:absolute; left:0; right:0; height:5px; background:#9d7c59; } .shelf::before { top:48%; } .shelf::after { top:72%; } .shelf-item { position:absolute; z-index:2; font-size:23px; filter:saturate(.8); } .can-stack { left:8%; top:16%; } .water-stack { right:10%; top:11%; color:#79c6d0; letter-spacing:2px; } .medical-box { right:9%; bottom:15%; padding:5px 8px; background:#ece9d9; color:#1e9d52; font:700 22px sans-serif; border:2px solid #4b5149; } .resource-inspect { position:absolute; z-index:5; left:18px; bottom:18px; display:flex; align-items:center; gap:10px; min-width:250px; padding:10px 13px; background:#17211eea; color:#edf0e3; border-left:3px solid var(--acid); opacity:0; transform:translateY(8px); pointer-events:none; transition:opacity .25s, transform .25s; } .resource-inspect.visible { opacity:1; transform:translateY(0); } .resource-inspect strong,.resource-inspect small { display:block; } .resource-inspect strong { color:var(--acid); font:12px 'DM Mono'; } .resource-inspect small { margin-top:4px; color:#b9c3b9; font-size:10px; line-height:1.4; } .inspect-icon { font-size:21px; }
    .room-resource { position:absolute; z-index:4; display:grid; place-items:center; width:44px; height:44px; border:1px solid #66756b; border-radius:50%; background:#edf0dfcc; color:#34453c; font:600 12px 'DM Mono'; cursor:pointer; transition:transform .2s, background .2s; } .room-resource:hover,.room-resource.active { background:var(--acid); transform:scale(1.12); } .room-resource.food { left:19%; top:23%; } .room-resource.water { right:13%; top:20%; } .room-resource.medicine { right:6%; bottom:18%; } .room-resource.battery { left:8%; bottom:22%; }
    .day-transition { position:fixed; z-index:20; inset:0; display:grid; place-items:center; align-content:center; gap:7px; background:#050706; color:#e9eee1; opacity:0; transition:opacity .45s ease; } .day-transition.visible { opacity:1; } .day-transition span { color:var(--acid); font:500 12px 'DM Mono'; letter-spacing:.35em; } .day-transition strong { font:500 clamp(80px,16vw,180px)/.8 'DM Mono'; letter-spacing:-.1em; } .day-transition small { color:#748178; font:11px 'DM Mono'; } .transition-rule { width:120px; height:1px; margin-bottom:12px; background:#66736a; }
    .living-room.mid { background:#8eaaa6; } .living-room.mid .window { right:-2%; border-width:16px; background:#707d79; box-shadow:inset 0 0 0 7px #352f2a; } .living-room.mid .plant { font-size:62px; }
    .living-room.late { background:#313b39; } .living-room.late::before { opacity:.08; } .living-room.late .window { background:#202727; border-color:#5b554b; width:48%; height:67%; } .living-room.late .sofa { background:#4a4038; } .living-room.late .plant { opacity:.25; } .living-room.late .radio { filter:grayscale(1); }
    .event { margin-top:30px; display:grid; grid-template-columns:1fr 1fr; gap:25px; align-items:start; }
    .decision-clock { margin-top:12px; display:flex; align-items:center; gap:10px; color:var(--rust); font:500 12px 'DM Mono'; } .clock-ring { width:32px; height:32px; display:grid; place-items:center; border:2px solid var(--rust); border-radius:50%; } .clock-ring.urgent { background:var(--rust); color:#fff; }
    .event-copy .kicker { color:var(--rust); font:500 11px 'DM Mono'; text-transform:uppercase; } .event-copy h2 { margin-top:9px; font-size:24px; letter-spacing:-.05em; } .event-copy p { margin-top:11px; color:#57615b; font-size:14px; line-height:1.7; }
    .choices { display:grid; gap:9px; } .choice { text-align:left; display:grid; grid-template-columns:30px 1fr; gap:10px; padding:14px; border:1px solid #b7bcb0; background:#eff0e8; color:var(--ink); transition:transform .15s, border-color .15s, background .15s; } .choice:hover { transform:translateX(4px); border-color:var(--ink); background:#f8f8f0; } .choice:disabled { cursor:default; opacity:.55; transform:none; } .choice.unaffordable { border-color:#d0a39a; color:#8f6258; background:#f1e4df; } .choice.unaffordable .choice-key { background:var(--rust); color:#fff; }
    .choice-key { width:25px; height:25px; display:grid; place-items:center; background:var(--ink); color:var(--acid); font:500 11px 'DM Mono'; } .choice strong { display:block; font-size:14px; } .choice small { display:block; margin-top:4px; color:#6d756f; font-size:11px; line-height:1.45; }
    aside { border-left:1px solid var(--line); background:#f1f1ea; padding:29px 24px; } aside h3 { font-size:13px; letter-spacing:-.02em; } .resource { padding:17px 0; border-bottom:1px solid var(--line); } .resource-head { display:flex; justify-content:space-between; align-items:center; font-size:12px; } .resource-value { font:500 20px 'DM Mono'; } .resource-note { margin-top:7px; color:var(--muted); font-size:11px; line-height:1.5; } .allocation { margin-top:25px; } .allocation h3 { margin-bottom:14px; } .alloc-row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #d8d9d0; font-size:12px; } .alloc-row span:last-child { font:500 12px 'DM Mono'; color:#5d6f64; } .alloc-row.warning span:last-child { color:var(--rust); }
    .log { margin-top:29px; } .log h3 { margin-bottom:13px; } .log p { color:#69736d; font-size:11px; line-height:1.55; padding:8px 0; border-bottom:1px solid #d8d9d0; } .log p:first-letter { color:var(--rust); }
    .overlay { position:fixed; inset:0; background:#15211ed9; display:grid; place-items:center; padding:22px; z-index:5; } .ending { max-width:570px; width:100%; background:var(--paper); padding:38px; border-top:5px solid var(--acid); } .ending h2 { margin-top:12px; font-size:34px; letter-spacing:-.06em; } .ending p { margin-top:18px; color:#58635d; font-size:14px; line-height:1.8; } .ending button { margin-top:27px; padding:12px 17px; border:0; background:var(--ink); color:var(--acid); font-size:12px; }
    .start-card { max-width:720px; width:100%; padding:clamp(27px,5vw,60px); background:linear-gradient(145deg,#eceee3,#cbd5c7); border:1px solid #718278; box-shadow:16px 16px 0 #07100dcc; } .start-card h2 { margin-top:13px; font-size:clamp(36px,7vw,76px); line-height:.95; letter-spacing:-.08em; } .start-card p { max-width:500px; margin-top:22px; color:#4e5d54; font-size:14px; line-height:1.8; } .keyword-row { display:flex; flex-wrap:wrap; gap:7px; margin-top:25px; } .keyword { padding:7px 10px; border:1px solid #899a8b; color:#34443c; font:500 10px 'DM Mono'; } .start-meta { display:flex; justify-content:space-between; align-items:end; gap:20px; margin-top:37px; padding-top:18px; border-top:1px solid #aab5a9; } .start-meta small { color:#637169; font:11px 'DM Mono'; line-height:1.7; } .start-button { padding:15px 20px; border:0; background:var(--ink); color:var(--acid); font-weight:600; }
    @media (max-width:900px) { .shell { grid-template-columns:1fr; } .rail { min-height:260px; } .day-wrap { margin-top:26px; } aside { border-left:0; border-top:1px solid var(--line); display:grid; grid-template-columns:1fr 1fr; gap:22px; } .log { grid-column:1/-1; } }
    @media (max-width:600px) { main { padding:22px 18px 32px; } .rail { padding:24px 18px; } .event { grid-template-columns:1fr; gap:20px; } .news { grid-template-columns:1fr; gap:7px; } aside { display:block; } .ending { padding:26px; } .family { transform:scale(.82); transform-origin:bottom center; } .family-dad { left:10%; } .family-mom { left:29%; } .family-son { left:52%; } .family-daughter { left:69%; } .start-meta { align-items:start; flex-direction:column; } .start-button { width:100%; } }
  </style>

<body>
  <div id="app"></div>
  <script src="characters.js"></script>
  <script src="room-ui.js"></script>
  <script>
    const events = [
      { title:'가족 대표 인증이 거절되었습니다', tag:'시민 패스 / 디지털 격차', text:'수경의 시민 패스가 세 번 거절됐다. 내일부터 배급소는 얼굴 인증을 통과한 사람만 들인다.', choices:[['A','암시장 계정을 산다','비상금 -18 · 해킹 위험'],['B','오프라인 민원실에 간다','비상금 -8 · 하루 소득 상실'],['C','가족 계정을 함께 등록한다','배터리 -4 · 연대 상승']] },
      { title:'철조망을 세우자는 방송', tag:'아파트 입대의 / 빈부격차', text:'폭우가 고지대까지 번졌다. 관리소장은 외부 난민을 막을 PMC 분담금을 요구한다.', choices:[['A','적극 동참한다','비상금 -22 · 우리 동만 안전'],['B','거부하고 방관한다','공동 배급 신뢰 하락'],['C','분담금을 난민 급식으로 돌린다','식량 -6 · 공동체 신뢰 상승']] },
      { title:'젖은 아이가 문을 두드린다', tag:'현관 앞 / 기후 난민', text:'인터폰 너머로 아이의 기침이 들린다. “물 한 모금만요.” 수경은 이미 문고리를 잡았다.', choices:[['A','문을 열고 들인다','식수 -10 · 감염 위험'],['B','인터폰을 꺼버린다','자원 보존 · 인간성 하락'],['C','문틈으로 물과 담요를 건넨다','식수 -6 · 작은 신뢰']] },
      { title:'서연에게 복구 징용령이 왔다', tag:'청년 고립 / 미래 포기', text:'오염 지역 복구를 위해 20대가 호출됐다. 거부하면 가족의 시민 패스도 정지된다.', choices:[['A','벽장 방공호에 숨긴다','배급 중단 위험 · 서연 보호'],['B','안전 장비를 쥐여 보낸다','식량 +8 · 서연 멘탈 하락'],['C','이웃들과 가짜 신분증을 만든다','비상금 -12 · 연대 상승']] },
      { title:'정수장이 마지막 경고를 보냈다', tag:'인과 지연 / 기반 시설', text:'물을 끌어올릴 전력이 사흘 안에 끊긴다. 지금의 작은 절약이 내일의 생존을 결정한다.', choices:[['A','우리 집 물통부터 채운다','식수 +12 · 공동체 신뢰 하락'],['B','복도 저수조를 함께 수리한다','식수 -4 · 연대 크게 상승'],['C','라디오 주파수를 공개한다','배터리 -5 · 정보망 상승']] },
      { title:'배급 앱이 새 등급을 발표했다', tag:'디지털 계급 / 고스트', text:'앱은 기부 이력이 없는 가구의 배급을 한 단계 낮췄다. 데이터가 곧 신분증이 됐다.', choices:[['A','우리 가족 기록만 위조한다','비상금 -10 · 이기심 상승'],['B','고스트 주민의 명단을 공개한다','배터리 -8 · 연대 상승'],['C','아무것도 하지 않는다','사기 하락 · 다음 날 배급 감소']] },
      { title:'엘리베이터가 멈췄다', tag:'가정의 방공호화 / 이웃', text:'정전으로 18층 복도가 봉쇄됐다. 옆집은 어린아이를 데리고 계단에 갇혔다.', choices:[['A','우리 집 문만 잠근다','배터리 보존 · 이기심 상승'],['B','손전등을 들고 구조한다','배터리 -7 · 체력 소모'],['C','층간 방송을 연결한다','배터리 -3 · 공동 대응']] },
      { title:'플랫폼 일당이 반 토막 났다', tag:'노동 불안 / 빈부격차', text:'민우의 배달 플랫폼은 위험 수당을 없앴다. 오늘 벌지 않으면 내일 먹을 것이 없다.', choices:[['A','위험 지역 배달을 수락한다','비상금 +14 · 건강 위험'],['B','동료들과 작업을 거부한다','비상금 -6 · 연대 상승'],['C','아파트 배급을 훔쳐 나온다','식량 +10 · 도덕심 급락']] },
      { title:'수경이 낯선 사람의 이름을 적었다', tag:'돌봄 노동 / 연대', text:'수경은 복도에 남은 사람들의 상태를 기록했다. 하지만 그 명단은 가족의 약점을 노출할 수도 있다.', choices:[['A','명단을 불태운다','안전 상승 · 연대 하락'],['B','공유 대장으로 바꾼다','배터리 -4 · 공동체 상승'],['C','우리 가족 정보만 남긴다','안전 상승 · 이기심 상승']] },
      { title:'준호가 문에 작은 표식을 그렸다', tag:'청년 세대 / 미래', text:'준호는 도움을 청하는 집을 찾기 위해 복도 벽에 표식을 남겼다. 그 표식은 경비대에게도 보인다.', choices:[['A','표식을 지운다','치안 상승 · 미래 포기'],['B','표식을 따라 물을 나눈다','식수 -8 · 도덕심 상승'],['C','암호를 새로 만든다','배터리 -3 · 연대 상승']] },
      { title:'도시 경계가 닫힌다는 소문', tag:'기후 난민 / 이동', text:'검문소가 닫히면 가족은 이 구역을 빠져나갈 수 없다. 남을지, 떠날지 선택해야 한다.', choices:[['A','가족만 먼저 탈출한다','비상금 -20 · 신뢰 붕괴'],['B','이웃과 함께 이동한다','식량 -8 · 연대 상승'],['C','집을 지키며 버틴다','자원 보존 · 외부 고립']] },
      { title:'문 밖에서 이름을 부른다', tag:'임계점 / 마지막 선택', text:'누군가가 당신의 이름을 정확히 알고 있다. 가족은 침묵하고, 현관의 잠금 표시만 붉게 깜빡인다.', choices:[['A','문을 잠근 채 숨는다','안전 상승 · 외부 신뢰 붕괴'],['B','문을 열고 함께 아침을 기다린다','식량 -8 · 연대 극대화'],['C','가족만 먼저 탈출한다','비상금 -12 · 관계 붕괴']] }
    ];
    let state;
    function fresh(){ return { day:1, event:0, food:48, water:42, medicine:18, battery:31, money:40, morale:65, health:76, trust:26, danger:28, morality:62, selfishness:18, timeLeft:60, started:false, gameOverReason:null, transitioning:false, paused:false, selectedResource:null, logs:['06:10  라디오가 “정상 운영 중”이라고 반복한다.'] }; }

    const choiceRequirements = {

    };

    let timerHandle;
    function isGameOver(){ return Boolean(state.gameOverReason) || state.day>30; }
    function checkNoChoices(){
      if(state.started && !isGameOver() && !events[state.event % events.length].choices.some((_,i)=>canAfford(state.event % events.length,i))){
        state.gameOverReason='no-choices';

v></div><div class="family family-mom"><img class="family-avatar" src="${characterArt.mom.image}" alt="${characterArt.mom.name}"><span>${characterArt.mom.name} · 엄마</span><div class="family-meter"><i style="width:${state.trust}%"></i></div></div><div class="family family-son"><img class="family-avatar" src="${characterArt.son.image}" alt="${characterArt.son.name}"><span>${characterArt.son.name} · 아들</span><div class="family-meter"><i style="width:${clamp(state.morale+8)}%"></i></div></div><div class="family family-daughter"><img class="family-avatar" src="${characterArt.daughter.image}" alt="${characterArt.daughter.name}"><span>${characterArt.daughter.name} · 딸</span><div class="family-meter"><i style="width:${state.morale}%"></i></div></div><div class="room-label">SHELTER 04 <span>신송도 · 가족의 거실</span></div></div><section class="event"><div class="event-copy"><div class="kicker">AFTERNOON / ${e.tag}</div><h2>${e.title}</h2><p>${e.text}</p><div class="decision-clock"><span class="clock-ring ${state.timeLeft<=10?'urgent':''}">${state.timeLeft}</span>선택 가능 시간</div></div><div class="choices" aria-label="오늘의 선택">${e.choices.map((c,i)=>`<button class="choice" onclick="choose(${i})" ${!state.started || ended || state.paused || state.transitioning || !canAfford(state.event % events.length,i)?'disabled':''}><span class="choice-key">${c[0]}</span><span><strong>${c[1]}</strong><small>${c[2]}</small></span></button>`).join('')}</div></section></main><aside><h3>보급 현황 <small>SUPPLIES</small></h3>${resources.map(x=>`<div class="resource"><div class="resource-head"><span>${x[0]}</span><span class="resource-value">${x[1]}</span></div><div class="resource-note">${x[2]}</div></div>`).join('')}<div class="allocation"><h3>가족의 상태 <small>RESIDENTS</small></h3><div class="alloc-row"><span>민우 / 생존·효율</span><span>${clamp(50+state.money-state.danger)}</span></div><div class="alloc-row"><span>수경 / 인도주의</span><span>${state.trust}</span></div><div class="alloc-row"><span>준호 / 미래 세대</span><span>${
